name: Build KICHS Android APK
# Rebuild includes fingerprint-to-PIN-overlay unlock fix

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk-setup
    paths:
      - 'KICHS_Android_Complete_Project.zip'
      - '.github/workflows/build-android.yml'
      - 'MainActivity.java'
      - 'fingerprint-settings-inject.js'
      - 'app-update.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q KICHS_Android_Complete_Project.zip -d extracted
          test -f extracted/KICHS_Android_Complete_Project/android/settings.gradle
          test -f extracted/KICHS_Android_Complete_Project/android/app/build.gradle

      - name: Load app version
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("app-update.json").read_text(encoding="utf-8"))
          version_code = int(data["versionCode"])
          version_name = str(data["versionName"])
          if version_code < 1 or not version_name:
              raise SystemExit("Invalid app version metadata")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"APP_VERSION_CODE={version_code}\\n")
              env.write(f"APP_VERSION_NAME={version_name}\\n")
          PY

      - name: Set Android app version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          gradle = Path("extracted/KICHS_Android_Complete_Project/android/app/build.gradle")
          source = gradle.read_text(encoding="utf-8")
          source, code_count = re.subn(r"\\bversionCode\\s+\\d+", "versionCode " + os.environ["APP_VERSION_CODE"], source, count=1)
          source, name_count = re.subn(r"""\\bversionName\\s+["'][^"']+["']""", 'versionName "' + os.environ["APP_VERSION_NAME"] + '"', source, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely set versionCode/versionName in app/build.gradle")
          gradle.write_text(source, encoding="utf-8")
          PY
      - name: Configure secure APK file sharing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("extracted/KICHS_Android_Complete_Project/android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          provider = """
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/kichs_file_paths" />
                  </provider>
          """
          if "androidx.core.content.FileProvider" not in text:
              text = text.replace("</application>", provider + "\n    </application>")
              manifest.write_text(text, encoding="utf-8")
          paths = Path("extracted/KICHS_Android_Complete_Project/android/app/src/main/res/xml/kichs_file_paths.xml")
          paths.parent.mkdir(parents=True, exist_ok=True)
          paths.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="shared_apk" path="shared_apk/" />
          </paths>
          """, encoding="utf-8")
          PY

      - name: Use connected native biometric implementation
        run: |
          cp MainActivity.java extracted/KICHS_Android_Complete_Project/android/app/src/main/java/ug/ac/kichs/student/MainActivity.java
      - name: Set permanent KICHS website address
        run: |
          sed -i 's#https://12773bdf.kichs-students-app.pages.dev/#https://kichs-app.pages.dev/#' extracted/KICHS_Android_Complete_Project/android/app/src/main/java/ug/ac/kichs/student/MainActivity.java
          grep -q 'APP_URL = "https://kichs-app.pages.dev/";' extracted/KICHS_Android_Complete_Project/android/app/src/main/java/ug/ac/kichs/student/MainActivity.java
      - name: Inject reliable Settings fingerprint button
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          java = Path("extracted/KICHS_Android_Complete_Project/android/app/src/main/java/ug/ac/kichs/student/MainActivity.java")
          js = Path("fingerprint-settings-inject.js").read_text(encoding="utf-8")
          source = java.read_text(encoding="utf-8")
          needle = "                    view.evaluateJavascript(bridgeScript, null);"
          if source.count(needle) != 1:
              raise SystemExit("Could not find the exact WebView bridge insertion point")
          addition = needle + "\n                    String reliableSettingsFingerprintScript = " + json.dumps(js) + ";\n                    view.evaluateJavascript(reliableSettingsFingerprintScript, null);"
          java.write_text(source.replace(needle, addition), encoding="utf-8")
          PY
          grep -q 'reliableSettingsFingerprintScript' extracted/KICHS_Android_Complete_Project/android/app/src/main/java/ug/ac/kichs/student/MainActivity.java

      - name: Configure permanent Android debug signing key
        env:
          KICHS_DEBUG_KEYSTORE_BASE64: ${{ secrets.KICHS_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KICHS_DEBUG_KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$KICHS_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: extracted/KICHS_Android_Complete_Project/android
        run: |
          cat > /tmp/kotlin-align.gradle <<'EOF'
          allprojects {
            configurations.configureEach {
              resolutionStrategy.eachDependency { details ->
                if (details.requested.group == "org.jetbrains.kotlin") {
                  details.useVersion "1.8.22"
                }
              }
            }
          }
          EOF
          gradle --init-script /tmp/kotlin-align.gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KICHS-Android-APK
          path: extracted/KICHS_Android_Complete_Project/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: KICHS Student App v${{ env.APP_VERSION_NAME }}
          body: |
            KICHS Student App version ${{ env.APP_VERSION_NAME }}.
            ${{ github.event.head_commit.message }}
          files: extracted/KICHS_Android_Complete_Project/android/app/build/outputs/apk/debug/*.apk
          overwrite_files: true
          make_latest: true
